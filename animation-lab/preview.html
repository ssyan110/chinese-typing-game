<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Combat animation study</title><style>*{box-sizing:border-box}body{margin:0;background:#102f34;color:#f3e8ce;font:15px/1.6 Arial,sans-serif}header{padding:20px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dcb76b44}h1{margin:0;font-size:22px}a{color:#a7d8cc}main{max-width:1280px;margin:auto}canvas{width:100%;height:min(65vh,660px);display:block}.controls{display:flex;flex-wrap:wrap;gap:10px;padding:20px 28px}button,select{font:inherit;background:#204b50;border:1px solid #75928c;color:#fff0cf;border-radius:7px;padding:10px 16px;cursor:pointer}button:hover{background:#326068}button:focus-visible,select:focus-visible{outline:3px solid #e5bd6e;outline-offset:3px}p{padding:0 28px;color:#adcbc3}#status{color:#f7d798;min-height:26px}</style><header><h1>Đấu Trường Hán Tự · 3D motion study</h1><a href="http://localhost:3011/CombatStudy">Mở trong Remotion ↗</a></header><main><canvas id="stage"></canvas><div class="controls"><select id="opponent" aria-label="Đối thủ"><option value="guardian">Ngọc vệ</option><option value="moth">Linh điệp</option><option value="sentinel">Đèn vệ</option></select><button data-action="strike">Tấn công</button><button data-action="ward">Hộ thuẫn</button><button data-action="defense">Phòng thủ</button><button data-action="hit">Bị đánh trúng</button><button data-action="mend">Hồi phục</button><button id="auto" aria-pressed="true">Phát / dừng chuỗi</button><select id="speed" aria-label="Tốc độ"><option value="1">Tốc độ bình thường</option><option value="0.5">Chậm 0,5×</option></select></div><p id="status">Chọn động tác để xem chuyển động của tay, chân, thân người và vũ khí.</p><p>Bản thử nghiệm nhân vật 3D. <a href="/">Chơi thử trong trò chơi ↗</a></p></main><script type="module">import {createCombatStage} from '../src/summoner/combat-scene3d.js';const canvas=document.querySelector('#stage'),stage=createCombatStage(canvas,{showcase:true});let event=null,start=0,speed=1,auto=false,last=0;const actions={strike:{outcome:'correct',spell:'strike',counter:true},ward:{outcome:'correct',spell:'ward',counter:true,blocked:7},defense:{outcome:'correct',spell:'strike',defending:true},hit:{outcome:'timeout',counter:true},mend:{outcome:'correct',spell:'mend',counter:true,heal:12}},labels={strike:'Lấy đà → bước tới → vung trượng → phản đòn',ward:'Ra chiêu → dựng khiên → đỡ đòn',defense:'Hạ trọng tâm → đưa tay lên đỡ đòn',hit:'Thủ lĩnh lấy đà và ra đòn → người chơi chịu đòn',mend:'Nâng trượng → hồi phục'};function play(action){event=actions[action];start=performance.now();document.querySelector('#status').textContent=labels[action];}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{auto=false;document.querySelector('#auto').setAttribute('aria-pressed','false');play(b.dataset.action)});document.querySelector('#opponent').onchange=e=>stage.setOpponent(e.target.value);document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);document.querySelector('#auto').onclick=()=>{auto=!auto;document.querySelector('#auto').setAttribute('aria-pressed',String(auto));start=performance.now();play('strike');};function frame(now){stage.resize(canvas.clientWidth,canvas.clientHeight);const elapsed=(now-start)/1000*speed;stage.draw(now/1000,event,elapsed);if(auto&&elapsed>3){const keys=Object.keys(actions);play(keys[(last++)%keys.length]);}requestAnimationFrame(frame)}play('strike');auto=true;requestAnimationFrame(frame);window.__combatStudy={stage,play};</script></html>
